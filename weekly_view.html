<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly View - Calendar App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="calendar-header">
            <h2 id="currentWeek">Week View</h2>
            <div class="view-controls">
                <a href="create_event.html"><button>+ New Event</button></a>
                <button id="logoutBtn" class="secondary-btn">Logout</button>
            </div>
        </div>

        <div style="margin-bottom: 1rem; text-align: center;">
            <a href="monthly_view.html"
                style="margin-right: 10px; text-decoration: none; color: var(--text-color);">Monthly</a>
            <a href="weekly_view.html"
                style="font-weight: bold; margin-right: 10px; color: var(--primary-color);">Weekly</a>
            <a href="daily_view.html" style="text-decoration: none; color: var(--text-color);">Daily</a>
        </div>

        <div id="weeklyGrid" class="weekly-grid">
            <!-- Weekly view generated by JS -->
        </div>

        <!-- Notification Permission Modal -->
        <div id="notificationPermissionModal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3 style="margin-bottom: 1rem;">📬 Enable Notifications</h3>
                <p style="margin-bottom: 1.5rem; color: #6b7280;">
                    Stay on top of your schedule! Enable notifications to receive timely reminders for your events.
                </p>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button id="notificationLaterBtn" class="btn secondary">Maybe Later</button>
                    <button id="notificationEnableBtn" class="btn primary">Enable Notifications</button>
                </div>
            </div>
        </div>

        <!-- Event Detail Modal -->
        <div id="eventDetailModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-modal" id="closeDetailModal">&times;</span>
                <h3 id="detailTitle">Event Details</h3>
                <div style="margin-top: 1rem;">
                    <p><strong>Title:</strong> <span id="detailEventTitle"></span></p>
                    <p><strong>Date & Time:</strong> <span id="detailEventDateTime"></span></p>
                    <p><strong>Location:</strong> <span id="detailEventLocation"></span></p>
                    <p><strong>Description:</strong></p>
                    <p id="detailEventDescription" style="white-space: pre-wrap;"></p>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button id="editEventBtn" class="btn primary" style="display: none;">Edit Event</button>
                    <button id="closeDetailBtn" class="btn secondary">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
