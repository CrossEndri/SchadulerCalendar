<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily View - Calendar App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    
<script type="module" src="js/daily-events.js"></script>

<body>
    <div class="container">
        <div class="calendar-header">
            <h2 id="currentDay">Daily View</h2>
            <div class="view-controls">
                <a href="create_event.html"><button>+ New Event</button></a>
                <button id="logoutBtn" class="secondary-btn">Logout</button>
            </div>
        </div>

        <div style="margin-bottom: 1rem; text-align: center;">
            <a href="monthly_view.html"
                style="margin-right: 10px; text-decoration: none; color: var(--text-color);">Monthly</a>
            <a href="weekly_view.html"
                style="margin-right: 10px; text-decoration: none; color: var(--text-color);">Weekly</a>
            <a href="daily_view.html" style="font-weight: bold; color: var(--primary-color);">Daily</a>
        </div>

        <div id="dailyGrid" class="daily-grid">
            <!-- Daily view generated by JS -->
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
