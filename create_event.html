<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - Calendar App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="auth-container" style="margin-top: 2rem; max-width: 600px;">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create New Event</h2>
            <form id="createEventForm">
                <div class="form-group">
                    <label for="title">Event Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="startDateTime">Start Date & Time</label>
                    <input type="datetime-local" id="startDateTime" required>
                </div>
                <div class="form-group">
                    <label for="endDateTime">End Date & Time</label>
                    <input type="datetime-local" id="endDateTime" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category...</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit">Create Event</button>
                    <a href="monthly_view.html" style="width: 100%;"><button type="button"
                            class="secondary-btn">Cancel</button></a>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
