<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly View - Calendar App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="calendar-header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="prevMonth" class="icon-btn">&lt;</button>
                <h2 id="currentMonth" style="margin: 0;">Month Year</h2>
                <button id="nextMonth" class="icon-btn">&gt;</button>
            </div>
            <div class="view-controls">
                <a href="create_event.html"><button>+ New Event</button></a>
                <button id="logoutBtn" class="secondary-btn">Logout</button>
            </div>
        </div>

        <div style="margin-bottom: 1rem; text-align: center;">
            <a href="monthly_view.html"
                style="font-weight: bold; margin-right: 10px; color: var(--primary-color);">Monthly</a>
            <a href="weekly_view.html"
                style="margin-right: 10px; text-decoration: none; color: var(--text-color);">Weekly</a>
            <a href="daily_view.html" style="text-decoration: none; color: var(--text-color);">Daily</a>
        </div>

        <div id="calendarGrid" class="calendar-grid">
            <!-- Calendar generated by JS -->
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
